<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pulse · Login</title>
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/style.css">
</head>
<body class="login">
<form class="card login-card" id="f">
  <img src="/static/icon.svg" alt="" width="56" height="56">
  <h1>Pulse</h1>
  <input type="password" id="pw" placeholder="Password" autocomplete="current-password" autofocus required>
  <button class="btn primary" type="submit">Sign in</button>
  <p class="muted" id="err"></p>
</form>
<script>
document.getElementById('f').onsubmit = async (e) => {
  e.preventDefault();
  const r = await fetch('/api/login', {method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({password: document.getElementById('pw').value})});
  if (r.ok) location.href = '/'; else document.getElementById('err').textContent = 'Wrong password';
};
</script>
</body>
</html>
